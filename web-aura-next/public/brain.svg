<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    Aura Logo — 大脑图标
    设计理念：极简科技风格大脑，左右半球 + 脑沟回纹路 + 脑干 + 神经节点
    品牌色：emerald-400 (#34D399)
  -->

  <!-- 左半球 -->
  <path
    d="M32 8C22 4 12 8 10 18C8 24 10 30 12 32C10 34 8 40 10 46C12 56 22 60 32 56"
    stroke="#34D399"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 右半球 -->
  <path
    d="M32 8C42 4 52 8 54 18C56 24 54 30 52 32C54 34 56 40 54 46C52 56 42 60 32 56"
    stroke="#34D399"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 中间裂沟 (中央沟) -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  <!-- 左半球脑沟纹路 -->
  <path d="M14 24C18 22 22 24 24 26" stroke="#34D399" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />
  <path d="M12 34C16 32 20 34 22 36" stroke="#34D399" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />
  <path d="M14 44C18 42 22 44 23 46" stroke="#34D399" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />

  <!-- 右半球脑沟纹路 -->
  <path d="M50 24C46 22 42 24 40 26" stroke="#34D399" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />
  <path d="M52 34C48 32 44 34 42 36" stroke="#34D399" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />
  <path d="M50 44C46 42 42 44 41 46" stroke="#34D399" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />

  <!-- 脑干 -->
  <path
    d="M30 56V62M34 56V62M29 62H35"
    stroke="#34D399"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.6"
  />

  <!-- 神经节点脉冲 -->
  <circle cx="20" cy="30" r="1.5" fill="#34D399" opacity="0.8" />
  <circle cx="44" cy="30" r="1.5" fill="#34D399" opacity="0.8" />
  <circle cx="28" cy="42" r="1.2" fill="#34D399" opacity="0.6" />
  <circle cx="36" cy="42" r="1.2" fill="#34D399" opacity="0.6" />

  <!-- 突触连接线 -->
  <line x1="20" y1="30" x2="28" y2="42" stroke="#34D399" stroke-width="0.8" opacity="0.3" />
  <line x1="44" y1="30" x2="36" y2="42" stroke="#34D399" stroke-width="0.8" opacity="0.3" />
</svg>
