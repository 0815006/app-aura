<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!--
    Aura — 极简科技风 · 光晕与多维形态
    字母「A」几何抽象化，顶端镂空置换为倾斜光晕环（多维透视）
    腿部线条接近光环处渐隐融合，寓意硬件/系统与智能气场的完美结合
    配色：深空蓝 #0B1026 底 · 极光绿→冰蓝呼吸渐变
  -->
  <defs>
    <!-- ========================================================== -->
    <!-- 极光呼吸渐变：翠绿 → 碧青 → 冰蓝 (自上而下)              -->
    <!-- ========================================================== -->
    <linearGradient id="aurora" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="35%"  stop-color="#2DD4BF"/>
      <stop offset="70%"  stop-color="#34D399"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- ========================================================== -->
    <!-- A 字腿部渐隐渐变（userSpaceOnUse，精确控制渐隐区间）       -->
    <!-- 底部全饱和 → 接近光环时半透明 → 光环内部全透              -->
    <!-- ========================================================== -->
    <linearGradient id="strokeFade" x1="0" y1="190" x2="0" y2="60"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#22C55E" stop-opacity="1.00"/>
      <stop offset="30%"  stop-color="#34D399" stop-opacity="1.00"/>
      <stop offset="55%"  stop-color="#2DD4BF" stop-opacity="0.95"/>
      <stop offset="70%"  stop-color="#38BDF8" stop-opacity="0.60"/>
      <stop offset="85%"  stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- ========================================================== -->
    <!-- 光环填充：中心透明 → 边缘极光发光                          -->
    <!-- ========================================================== -->
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="78%"  stop-color="#2DD4BF" stop-opacity="0.15"/>
      <stop offset="90%"  stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="97%"  stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.95"/>
    </radialGradient>

    <!-- ========================================================== -->
    <!-- 光环外部柔光扩散 (大气感)                                   -->
    <!-- ========================================================== -->
    <radialGradient id="outerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="50%"  stop-color="#2DD4BF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- 背景：深空蓝圆角方形                                         -->
  <!-- ============================================================ -->
  <rect width="200" height="200" rx="36" fill="#0B1026"/>

  <!-- ============================================================ -->
  <!-- 光环外部柔光 — 先画，在 A 字后面                             -->
  <!-- ============================================================ -->
  <ellipse cx="100" cy="46" rx="62" ry="52" fill="url(#outerAura)"/>

  <!-- ============================================================ -->
  <!-- ★ A 字母主体                                                -->
  <!-- 三条粗几何线：左腿 / 右腿 / 横杠                              -->
  <!-- 使用渐隐渐变，腿部顶端接近光环处透明 → 融入能量场             -->
  <!-- ============================================================ -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 左腿 -->
    <line x1="46" y1="178" x2="80" y2="72"
          stroke="url(#strokeFade)" stroke-width="18"/>
    <!-- 右腿 -->
    <line x1="154" y1="178" x2="120" y2="72"
          stroke="url(#strokeFade)" stroke-width="18"/>
    <!-- 横杠（低于光环，全饱和极光渐变） -->
    <line x1="56" y1="120" x2="144" y2="120"
          stroke="url(#aurora)" stroke-width="16"/>
  </g>

  <!-- ============================================================ -->
  <!-- ★ 光晕环 (多维透视 — 椭圆模拟 3D 倾斜)                      -->
  <!-- 渲染在 A 字上方，覆盖腿部渐隐区，形成顶端「镂空替换」效果     -->
  <!-- ============================================================ -->
  <!-- 环主体填充 -->
  <ellipse cx="100" cy="46" rx="34" ry="28" fill="url(#ringGlow)"/>
  <!-- 环外缘 (粗，高亮) -->
  <ellipse cx="100" cy="46" rx="34" ry="28"
           stroke="url(#aurora)" stroke-width="2.5" fill="none" opacity="0.92"/>
  <!-- 环内缘 (细，柔和) -->
  <ellipse cx="100" cy="46" rx="27" ry="22"
           stroke="url(#aurora)" stroke-width="1" fill="none" opacity="0.35"/>
  <!-- 环心微光 -->
  <ellipse cx="100" cy="46" rx="3.5" ry="3"
           fill="#38BDF8" opacity="0.5"/>

  <!-- ============================================================ -->
  <!-- 能量粒子 (环绕光环的悬浮光点 — 营造呼吸感)                   -->
  <!-- ============================================================ -->
  <circle cx="124" cy="38"  r="1.8" fill="#38BDF8" opacity="0.6"/>
  <circle cx="76"  cy="34"  r="1.4" fill="#2DD4BF" opacity="0.5"/>
  <circle cx="122" cy="58"  r="1.2" fill="#2DD4BF" opacity="0.45"/>
  <circle cx="78"  cy="56"  r="1.0" fill="#34D399" opacity="0.42"/>
  <circle cx="106" cy="24"  r="0.9" fill="#38BDF8" opacity="0.38"/>
  <circle cx="94"  cy="22"  r="0.7" fill="#34D399" opacity="0.35"/>
  <circle cx="112" cy="68"  r="0.8" fill="#2DD4BF" opacity="0.30"/>
</svg>
