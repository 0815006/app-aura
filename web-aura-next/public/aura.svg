<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!--
    Aura — 能量块 Logo
    蓝绿渐变正方体，深邃夜空蓝底色，极光绿→冰蓝呼吸渐变
  -->
  <defs>
    <!-- 顶面渐变：冰蓝 → 碧青 (最亮面) -->
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="50%"  stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- 左面渐变：碧青 → 翠绿 -->
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- 右面渐变：翠绿 → 深绿 (最暗面) -->
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- 外发光 -->
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2DD4BF" stop-opacity="0.25"/>
      <stop offset="50%"  stop-color="#2DD4BF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="200" rx="36" fill="#0B1026"/>

  <!-- 外发光 -->
  <circle cx="100" cy="95" r="80" fill="url(#outerGlow)"/>

  <!-- ============================================================ -->
  <!-- 等距正方体 (isometric cube)                                  -->
  <!-- 三面可见：顶 / 左 / 右                                       -->
  <!-- ============================================================ -->
  <g stroke="#0B1026" stroke-width="2" stroke-linejoin="round">
    <!-- 顶面 (菱形) -->
    <polygon points="100,28  156,58  100,88  44,58"
             fill="url(#faceTop)"/>
    <!-- 左面 -->
    <polygon points="44,58  100,88  100,148  44,118"
             fill="url(#faceLeft)"/>
    <!-- 右面 -->
    <polygon points="100,88  156,58  156,118  100,148"
             fill="url(#faceRight)"/>
  </g>

  <!-- 棱线高光 -->
  <g stroke="#38BDF8" stroke-width="1.2" fill="none" opacity="0.5">
    <!-- 顶棱 -->
    <line x1="100" y1="28" x2="156" y2="58"/>
    <line x1="100" y1="28" x2="44"  y2="58"/>
    <!-- 左棱 -->
    <line x1="44"  y1="58" x2="44"  y2="118"/>
    <!-- 右棱 -->
    <line x1="156" y1="58" x2="156" y2="118"/>
  </g>

  <!-- 能量粒子 -->
  <circle cx="162" cy="56"  r="1.6" fill="#38BDF8" opacity="0.55"/>
  <circle cx="40"  cy="56"  r="1.3" fill="#2DD4BF" opacity="0.50"/>
  <circle cx="100" cy="24"  r="1.4" fill="#38BDF8" opacity="0.50"/>
  <circle cx="162" cy="120" r="1.0" fill="#34D399" opacity="0.40"/>
  <circle cx="40"  cy="120" r="1.0" fill="#2DD4BF" opacity="0.35"/>
</svg>
