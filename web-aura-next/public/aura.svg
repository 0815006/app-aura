<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!--
    Aura Logo — 「光晕与多维形态」v2
    设计概念：字母 "A" 几何抽象化，顶端镂空替换为极光渐变圆环
    关键特征：A 字腿部在与光环相交处渐隐融合，而非生硬截断
    品牌色：深空蓝底 #0B1026 / 主体 翠绿→冰蓝渐变
  -->
  <defs>
    <!-- ============================================================ -->
    <!-- 极光渐变：翠绿 (#34D399) → 青碧 (#2DD4BF) → 冰蓝 (#38BDF8) -->
    <!-- ============================================================ -->
    <linearGradient id="aurora" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#34D399"/>
      <stop offset="40%"  stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- ============================================================ -->
    <!-- 光环填充径向渐变：中心透明 → 边缘发光 -->
    <!-- ============================================================ -->
    <radialGradient id="ringFill" cx="50%" cy="50%" r="50%">
      <stop offset="68%"  stop-color="#34D399" stop-opacity="0"/>
      <stop offset="84%"  stop-color="#2DD4BF" stop-opacity="0.30"/>
      <stop offset="93%"  stop-color="#38BDF8" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.95"/>
    </radialGradient>

    <!-- ============================================================ -->
    <!-- 光环外部柔光扩散 -->
    <!-- ============================================================ -->
    <radialGradient id="ringOuterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2DD4BF" stop-opacity="0.20"/>
      <stop offset="60%"  stop-color="#2DD4BF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <!-- ============================================================ -->
    <!-- ★ 关键：A 字腿部渐隐遮罩（实现与光环的融合消隐） -->
    <!-- 腿部在接近光环底缘时逐渐透明，产生"融入能量场"的视觉效果 -->
    <!-- ============================================================ -->
    <linearGradient id="legFade" x1="0" y1="0" x2="0" y2="1"
                    gradientUnits="userSpaceOnUse"
                    gradientTransform="matrix(1 0 0 1 0 48)">
      <!-- y=48 是光环下缘 (~82px) 上方开始渐隐 -->
      <stop offset="0%"   stop-color="black"/>   <!-- 光环内部：完全透明 -->
      <stop offset="12%"  stop-color="black"/>   <!-- 光环下缘附近 -->
      <stop offset="30%"  stop-color="white"/>   <!-- 开始显现 -->
      <stop offset="100%" stop-color="white"/>   <!-- 下方：完全不透明 -->
      <!-- 映射到实际坐标: y=48~88 为过渡区，y=88+ 全显 -->
    </linearGradient>

    <mask id="aMask">
      <rect width="200" height="200" fill="white"/>
      <!-- 在腿部穿过光环的区域施加渐隐 -->
      <rect x="0" y="0" width="200" height="88" fill="url(#legFade)"/>
    </mask>

    <!-- ============================================================ -->
    <!-- A 字横杠渐隐遮罩（横杠在光环下方，无需强渐隐，微调即可） -->
    <!-- ============================================================ -->
  </defs>

  <!-- ============================================================ -->
  <!-- 背景：深空蓝圆角方形 -->
  <!-- ============================================================ -->
  <rect width="200" height="200" rx="36" fill="#0B1026"/>

  <!-- ============================================================ -->
  <!-- 光环外部柔光（先渲染，在 A 字后面） -->
  <!-- ============================================================ -->
  <circle cx="100" cy="52" r="72" fill="url(#ringOuterGlow)"/>

  <!-- ============================================================ -->
  <!-- A 字母主体（应用渐隐遮罩 → 腿部融入光环） -->
  <!-- 粗几何无衬线线条，极光渐变 -->
  <!-- ============================================================ -->
  <g mask="url(#aMask)">
    <g stroke="url(#aurora)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <!-- 左腿：底部 → 光环左下缘 -->
      <line x1="50"  y1="178" x2="75"  y2="65"/>
      <!-- 右腿：底部 → 光环右下缘 -->
      <line x1="150" y1="178" x2="125" y2="65"/>
      <!-- 横杠 -->
      <line x1="60"  y1="118" x2="140" y2="118"/>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- ★ 光环（渲染在 A 字上方，遮住腿部顶端，形成镂空错觉） -->
  <!-- ============================================================ -->
  <!-- 环主体 (径向渐变填充，中心透明边缘发光) -->
  <circle cx="100" cy="52" r="32" fill="url(#ringFill)"/>
  <!-- 环外缘描边（锐利） -->
  <circle cx="100" cy="52" r="32" stroke="url(#aurora)" stroke-width="2.5" fill="none" opacity="0.90"/>
  <!-- 环内缘描边（柔和） -->
  <circle cx="100" cy="52" r="26" stroke="url(#aurora)" stroke-width="1.2" fill="none" opacity="0.45"/>
  <!-- 环心亮点 -->
  <circle cx="100" cy="52" r="4.5" fill="#38BDF8" opacity="0.55"/>

  <!-- ============================================================ -->
  <!-- 装饰光点（环绕光环的能量粒子） -->
  <!-- ============================================================ -->
  <circle cx="122" cy="44"  r="1.8" fill="#38BDF8" opacity="0.55"/>
  <circle cx="120" cy="60"  r="1.3" fill="#2DD4BF" opacity="0.45"/>
  <circle cx="82"  cy="38"  r="1.4" fill="#2DD4BF" opacity="0.50"/>
  <circle cx="78"  cy="58"  r="1.0" fill="#34D399" opacity="0.40"/>
  <circle cx="106" cy="76"  r="0.9" fill="#38BDF8" opacity="0.35"/>
  <circle cx="94"  cy="27"  r="1.0" fill="#34D399" opacity="0.40"/>

  <!-- ============================================================ -->
  <!-- 底部微光点（呼应光环） -->
  <!-- ============================================================ -->
  <circle cx="172" cy="168" r="0.8" fill="#38BDF8" opacity="0.25"/>
  <circle cx="28"  cy="168" r="0.8" fill="#34D399" opacity="0.25"/>
</svg>
